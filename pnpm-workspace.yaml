packages:
  - 'apps/*'
  - 'packages/*'

# ---------------------------------------------------------------------------
# Central dependency version catalog (pnpm >= 9.5).
# Every workspace package references these with the `catalog:` protocol, so a
# version bump happens in exactly one place and `pnpm install` propagates it.
# ---------------------------------------------------------------------------
catalog:
  # --- Toolchain -----------------------------------------------------------
  '@types/node': ^22.18.13
  typescript: ^6.0.3
  turbo: ^2.11.5
  eslint: ^10.11.0
  '@eslint/js': ^10.0.1
  globals: ^17.12.0
  typescript-eslint: ^8.71.0
  eslint-config-prettier: ^10.1.8
  eslint-config-next: ^16.3.7
  prettier: ^3.9.9
  tsx: ^4.23.15
  rimraf: ^6.1.3
  # Runs the TypeScript watcher and the Node restarter side by side in `pnpm dev`.
  # A single-process alternative (nest start --watch) hides an extra tsc
  # invocation behind a CLI whose ESM support is easy to misjudge; two explicit
  # processes are boring and debuggable.
  concurrently: ^9.2.1
  # Unit tests. Vitest over Jest: the workspace is native ESM and the backend
  # apps need emitDecoratorMetadata for Nest DI, which Jest's TypeScript
  # transform does not produce.
  # Pinned exactly, not caret: `@vitest/coverage-v8` declares an exact peer on
  # the vitest version (`5.0.3` wants vitest `5.0.3`), so a caret here lets the
  # two drift apart on a fresh lockfile and prints an unmet-peer warning on every
  # install.
  vitest: 5.0.2
  '@vitest/coverage-v8': 5.0.2

  # --- NestJS --------------------------------------------------------------
  '@nestjs/common': ^12.1.1
  '@nestjs/core': ^12.1.1
  '@nestjs/platform-express': ^12.1.1
  '@nestjs/config': ^12.0.1
  '@nestjs/jwt': ^12.0.2
  '@nestjs/passport': ^12.0.0
  '@nestjs/swagger': ^12.0.2
  '@nestjs/terminus': ^12.1.0
  '@nestjs/throttler': ^6.7.1
  '@nestjs/bullmq': ^12.0.0
  '@nestjs/cli': ^12.0.8
  '@nestjs/schematics': ^12.0.6
  '@nestjs/testing': ^12.1.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  passport: ^0.7.0
  passport-jwt: ^4.0.1
  '@types/passport-jwt': ^4.0.1
  '@types/express': ^5.0.6
  '@types/cookie-parser': ^1.4.9
  cookie-parser: ^1.4.7
  helmet: ^8.3.0
  compression: ^1.8.1
  '@types/compression': ^1.8.1

  # --- Auth ---------------------------------------------------------------
  # `jose` for JWT sign/verify: a WebCrypto-only implementation, so it needs no
  # native module and no OpenSSL headers. jsonwebtoken is CommonJS and pulls in
  # a transitive dependency tree; this workspace is native ESM, so a CJS-only
  # signing library is a friction point for no benefit.
  jose: ^6.2.12

  # --- Validation / schema -------------------------------------------------
  zod: ^4.6.5
  class-validator: ^0.15.1
  class-transformer: ^0.5.1

  # --- Prisma / data -------------------------------------------------------
  prisma: ^7.10.0
  '@prisma/client': ^7.10.0
  '@prisma/adapter-pg': ^7.10.0
  pg: ^8.23.0
  '@types/pg': ^8.23.1
  dotenv: ^18.0.4

  # --- Queue / cache -------------------------------------------------------
  bullmq: ^6.3.10
  ioredis: ^6.0.0

  # --- Web -----------------------------------------------------------------
  next: ^16.3.7
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  'server-only': ^0.0.1

  # --- Testing -------------------------------------------------------------
  '@types/jest': ^30.0.0
  jest: ^30.0.0
  ts-jest: ^29.4.0
  supertest: ^7.1.0
  '@types/supertest': ^6.0.2

# Lifecycle scripts that are explicitly allowed to run during `pnpm install`.
# Everything else must be opted in explicitly (pnpm >= 10 blocks them by default).
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - sharp
  - unrs-resolver

# Never auto-install a workspace dependency that the package forgot to declare.
# Surfacing this as an install error prevents phantom/phantom-resolution bugs.
dedupe:
  - '@nestjs/*'
  - '@prisma/*'
  - prisma
  - bullmq
  - ioredis
  - react
  - react-dom
